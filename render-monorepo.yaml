# Configuración de Render para proyecto monorepo
# Frontend + Backend en un solo servicio

services:
  - type: web
    name: gestion-citas-medicas
    runtime: php
    plan: free
    buildCommand: chmod +x build-monorepo.sh && ./build-monorepo.sh
    startCommand: chmod +x start-monorepo.sh && ./start-monorepo.sh
    healthCheckPath: /api/health
    envVars:
      # Base de Datos (Supabase PostgreSQL)
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres
      - key: DB_PASSWORD
        sync: false
      
      # Supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      
      # JWT
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400
      
      # App
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        sync: false
      
      # CORS (mismo origen, no necesario)
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      
      # Frontend (para el build)
      - key: VITE_API_BASE_URL
        value: /api
      - key: VITE_APP_NAME
        value: Sistema de Gestión Médica
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
