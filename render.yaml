# Configuración de Render para despliegue automático
# Este archivo configura tanto el backend como el frontend

services:
  # ============================================
  # BACKEND PHP API
  # ============================================
  - type: web
    name: gestion-citas-backend
    runtime: php
    plan: free
    buildCommand: cd backend && chmod +x build.sh && ./build.sh
    startCommand: cd backend && chmod +x start.sh && ./start.sh
    healthCheckPath: /api/health
    envVars:
      # Base de Datos (Supabase PostgreSQL)
      # IMPORTANTE: Configurar estas variables en el dashboard de Render
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres
      - key: DB_PASSWORD
        sync: false
      
      # Supabase
      # IMPORTANTE: Configurar estas variables en el dashboard de Render
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      
      # JWT
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400
      
      # App
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        sync: false
      
      # CORS (se actualizará después del deploy del frontend)
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # ============================================
  # FRONTEND REACT
  # ============================================
  - type: web
    name: gestion-citas-frontend
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # IMPORTANTE: Configurar estas variables en el dashboard de Render
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_APP_NAME
        value: Sistema de Gestión Médica
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
